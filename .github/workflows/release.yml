name: Release Windows beta

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HD2_DATA_MANIFEST_URL: ${{ vars.HD2_DATA_MANIFEST_URL }}
          HD2_DATA_PUBLIC_KEY: ${{ vars.HD2_DATA_PUBLIC_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "HD2 战术配装终端 v__VERSION__"
          releaseBody: "Windows x64 非官方公开测试版。安装时可能出现 SmartScreen 提示。"
          releaseDraft: true
          prerelease: true
